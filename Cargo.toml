[package]
name = "godo-vps"
version = "0.1.0"
edition = "2021"
description = "Singapore VPS proxy manager — VLESS+Reality + Hysteria2, multi-device"

[[bin]]
name = "godo-vps"
path = "src/main.rs"

[dependencies]
tokio          = { version = "1",    features = ["full"] }
clap           = { version = "4",    features = ["derive", "env"] }
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"
serde_yaml     = "0.9"
anyhow         = "1"
thiserror      = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy        = "0.15"
reqwest        = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid           = { version = "1",    features = ["v4"] }
rand           = "0.8"
rand_core      = { version = "0.6",  features = ["getrandom"] }
x25519-dalek   = { version = "2",    features = ["static_secrets"] }
base64         = "0.22"
hex            = "0.4"
url            = "2"
colored        = "2"
indicatif      = "0.17"
async-trait    = "0.1"
chrono         = { version = "0.4",  features = ["serde"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
